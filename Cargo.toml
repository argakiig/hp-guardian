[package]
name = "hp-guard"
version = "0.1.0"
edition = "2021"
description = "Declarative policy engine for agentic guardrails and enforcement"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"

[dev-dependencies]
insta = "1"
