[package]
name = "hp-guard"
version = "0.1.0"
edition = "2021"
description = "Declarative policy engine for agentic guardrails and enforcement"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
insta = "1"
